[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "seed-ai"
version = "0.1.0"
description = "SEED-AI governed local orchestration foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
  "psutil==7.1.3",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
integration = [
  "mcp==2.3.0",
  "uvicorn==0.54.0",
]
dev = [
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
packages = ["brain", "brain.providers", "core", "interfaces", "memory", "runtime", "runtime.skills", "runtime.windows", "security"]
